<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Доломиты</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  body { min-height: 100svh; display: flex; align-items: center; justify-content: center;
    font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(165deg, #2c4a2e 0%, #1d3220 55%, #14231a 100%); color: #eef2ea; }
  .card { width: min(92vw, 380px); text-align: center; padding: 34px 26px 30px;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14);
    border-radius: 20px; backdrop-filter: blur(8px); }
  .logo { font-size: 44px; }
  h1 { font-size: 20px; margin: 10px 0 4px; letter-spacing: .3px; }
  p { color: #b9c7b4; font-size: 13.5px; margin-bottom: 20px; }
  input { width: 100%; padding: 13px 14px; font: inherit; border-radius: 12px; border: 1.5px solid rgba(255,255,255,.25);
    background: rgba(0,0,0,.25); color: #fff; text-align: center; outline: none; }
  input:focus { border-color: #9ec27a; }
  button { width: 100%; margin-top: 12px; padding: 13px; font: 600 15px -apple-system, sans-serif;
    border: none; border-radius: 12px; background: #6aa127; color: #fff; cursor: pointer; transition: transform .12s, filter .15s; }
  button:active { transform: scale(.97); }
  .err { color: #ff9d8f; font-size: 13px; height: 18px; margin-top: 10px; }
  .shake { animation: sh .4s; }
  @keyframes sh { 20%,60% { transform: translateX(-7px); } 40%,80% { transform: translateX(7px); } }
</style>
</head>
<body>
<form class="card" id="f">
  <div class="logo">🚵</div>
  <h1>Доломиты на гравеле</h1>
  <p>Приватный маршрут-гид · 14–23 августа 2026</p>
  <input id="pw" type="password" placeholder="Пароль" autocomplete="current-password" autofocus>
  <button>Открыть</button>
  <div class="err" id="err"></div>
</form>
<script>
const SALT = "06e44bda88508671cf39d3e2d6d325ae", IV = "18a209ea8eeec6f90a6b634d", CT = "03426c0c9a23cd22436f3b8e66da453f90e79c8668b709754592cd1fe28be442";
const un = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));
async function unlock(pw) {
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: un(SALT), iterations: 310000, hash: "SHA-256" },
    km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: un(IV) }, key, un(CT));
  return new TextDecoder().decode(pt);
}
async function go(t) { location.replace("./" + t + "/"); }
// старый service worker корневой области — снести, чтобы не отдавал кэш
if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(rs =>
  rs.forEach(r => { if (!/\/[0-9a-f]{16}\/$/.test(new URL(r.scope).pathname)) r.unregister(); }));
const saved = localStorage.getItem("dolomiti_t");
if (saved) fetch("./" + saved + "/manifest.json", { method: "HEAD" })
  .then(r => { if (r.ok) go(saved); else localStorage.removeItem("dolomiti_t"); }).catch(() => {});
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.querySelector("button"); btn.textContent = "…";
  try {
    const t = await unlock(document.getElementById("pw").value.trim());
    localStorage.setItem("dolomiti_t", t);
    go(t);
  } catch (err) {
    btn.textContent = "Открыть";
    document.getElementById("err").textContent = "Неверный пароль";
    document.querySelector(".card").classList.add("shake");
    setTimeout(() => document.querySelector(".card").classList.remove("shake"), 450);
  }
});
</script>
</body>
</html>
